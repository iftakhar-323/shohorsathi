name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, order, provider, custom_request, media, subscription, payment, chat, notification, city, loyalty, b2b, analytics]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shohor
          POSTGRES_PASSWORD: shohor
          POSTGRES_DB: ${{ matrix.service }}_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shohor"
          --health-interval 5s
          --health-retries 10
    env:
      POSTGRES_DB: ${{ matrix.service }}_db
      POSTGRES_USER: shohor
      POSTGRES_PASSWORD: shohor
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ../common -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/web-core/scripts/check-i18n.mjs
      - run: pnpm -r build
