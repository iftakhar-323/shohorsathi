name: shohorsathi

x-django: &django
  env_file: .env
  volumes:
    - ./.keys:/keys:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # ---- auth -------------------------------------------------------------------
  auth:
    <<: *django
    build: { context: ./services, dockerfile: auth/Dockerfile }
    environment: &auth-env
      POSTGRES_DB: auth_db
      DJANGO_SECRET_KEY: ${AUTH_SECRET_KEY}
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  auth-worker:
    <<: *django
    build: { context: ./services, dockerfile: auth/Dockerfile }
    depends_on: [auth]
    environment: *auth-env
    command: celery -A config worker -Q auth -l info --concurrency 2

  # ---- catalog ----------------------------------------------------------------
  catalog:
    <<: *django
    build: { context: ./services, dockerfile: catalog/Dockerfile }
    environment: &catalog-env
      POSTGRES_DB: catalog_db
      DJANGO_SECRET_KEY: ${CATALOG_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  catalog-worker:
    <<: *django
    build: { context: ./services, dockerfile: catalog/Dockerfile }
    depends_on: [catalog]
    environment: *catalog-env
    command: celery -A config worker -Q catalog -l info --concurrency 2

  # ---- order ------------------------------------------------------------------
  order:
    <<: *django
    build: { context: ./services, dockerfile: order/Dockerfile }
    environment: &order-env
      POSTGRES_DB: order_db
      DJANGO_SECRET_KEY: ${ORDER_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  order-worker:
    <<: *django
    build: { context: ./services, dockerfile: order/Dockerfile }
    depends_on: [order]
    environment: *order-env
    command: celery -A config worker -Q order -l info --concurrency 2

  # ---- provider ---------------------------------------------------------------
  provider:
    <<: *django
    build: { context: ./services, dockerfile: provider/Dockerfile }
    environment: &provider-env
      POSTGRES_DB: provider_db
      DJANGO_SECRET_KEY: ${PROVIDER_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  provider-worker:
    <<: *django
    build: { context: ./services, dockerfile: provider/Dockerfile }
    depends_on: [provider]
    environment: *provider-env
    # -B runs the periodic jobs (weekly payouts) in this worker.
    command: celery -A config worker -B -Q provider -l info --concurrency 2

  # ---- custom requests --------------------------------------------------------
  custom-request:
    <<: *django
    build: { context: ./services, dockerfile: custom_request/Dockerfile }
    environment: &custom-request-env
      POSTGRES_DB: custom_request_db
      DJANGO_SECRET_KEY: ${CUSTOM_REQUEST_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  custom-request-worker:
    <<: *django
    build: { context: ./services, dockerfile: custom_request/Dockerfile }
    depends_on: [custom-request]
    environment: *custom-request-env
    command: celery -A config worker -Q custom_request -l info --concurrency 2

  # ---- media ------------------------------------------------------------------
  media:
    <<: *django
    build: { context: ./services, dockerfile: media/Dockerfile }
    environment:
      POSTGRES_DB: media_db
      DJANGO_SECRET_KEY: ${MEDIA_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      MEDIA_ROOT: /data/media
    volumes:
      - ./.keys:/keys:ro
      - media:/data/media

  # ---- subscriptions ----------------------------------------------------------
  subscription:
    <<: *django
    build: { context: ./services, dockerfile: subscription/Dockerfile }
    environment: &subscription-env
      POSTGRES_DB: subscription_db
      DJANGO_SECRET_KEY: ${SUBSCRIPTION_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  subscription-worker:
    <<: *django
    build: { context: ./services, dockerfile: subscription/Dockerfile }
    depends_on: [subscription]
    environment: *subscription-env
    # -B: nightly dispatch of tomorrow's visits and the daily renewals
    command: celery -A config worker -B -Q subscription -l info --concurrency 2

  # ---- payments ---------------------------------------------------------------
  payment:
    <<: *django
    build: { context: ./services, dockerfile: payment/Dockerfile }
    environment: &payment-env
      POSTGRES_DB: payment_db
      DJANGO_SECRET_KEY: ${PAYMENT_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  payment-worker:
    <<: *django
    build: { context: ./services, dockerfile: payment/Dockerfile }
    depends_on: [payment]
    environment: *payment-env
    command: celery -A config worker -Q payment -l info --concurrency 2

  # ---- chat (ASGI + WebSocket) ------------------------------------------------
  chat:
    <<: *django
    build: { context: ./services, dockerfile: chat/Dockerfile }
    environment:
      POSTGRES_DB: chat_db
      DJANGO_SECRET_KEY: ${CHAT_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem

  # ---- notifications ----------------------------------------------------------
  notification:
    <<: *django
    build: { context: ./services, dockerfile: notification/Dockerfile }
    environment: &notification-env
      POSTGRES_DB: notification_db
      DJANGO_SECRET_KEY: ${NOTIFICATION_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
  notification-worker:
    <<: *django
    build: { context: ./services, dockerfile: notification/Dockerfile }
    depends_on: [notification]
    environment: *notification-env
    command: celery -A config worker -Q notification -l info --concurrency 2

  # ---- city layer: issues + community -----------------------------------------
  city:
    <<: *django
    build: { context: ./services, dockerfile: city/Dockerfile }
    environment:
      POSTGRES_DB: city_db
      DJANGO_SECRET_KEY: ${CITY_SECRET_KEY}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    depends_on: [auth, catalog, order, provider, custom-request, media, subscription, payment, chat, notification, city]

volumes:
  pgdata:
  media:
