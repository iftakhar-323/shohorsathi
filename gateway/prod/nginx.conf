# Production gateway. ${…} values are filled from the environment at container start (nginx envsubst templates).
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 12m;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

include /etc/nginx/snippets/routes.map;

# HTTP: Let's Encrypt challenges, everything else to HTTPS.
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${CUSTOMER_DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/${CUSTOMER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CUSTOMER_DOMAIN}/privkey.pem;
    include /etc/nginx/snippets/security.inc;
    include /etc/nginx/snippets/api.inc;

    root /srv/customer;
    location / { try_files $uri /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}

