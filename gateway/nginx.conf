# Docker's DNS; resolving per request lets the gateway start before every service is up.
resolver 127.0.0.11 valid=10s ipv6=off;

map $uri $service {
    default "";

    ~^/api/(auth|me|areas|cities)/                                 auth;
    ~^/api/admin/(areas|users)/                                    auth;

    ~^/api/(catalog|categories|products|services)/                 catalog;

    ~^/api/(order|cart|orders|bookings)/                           order;
    ~^/api/admin/(orders|bookings|warranty-claims|order-stats)/    order;

    ~^/api/(provider|providers)/                                   provider;
    ~^/api/admin/(providers|jobs|payouts|provider-stats)/          provider;

    ~^/api/(custom_request|custom-requests)/                       custom-request;
    ~^/api/admin/custom-requests/                                  custom-request;

    ~^/api/media/                                                  media;

    ~^/api/(subscription|subscriptions|subscription-plans|subscription-addons|meal-menu)/   subscription;
    ~^/api/admin/(subscriptions|plan-prices|student-verifications|subscription-stats)/      subscription;

    ~^/api/(payment|payments)/                                     payment;
    ~^/api/admin/(payments|refunds)/                               payment;

    ~^/api/chat/                                                   chat;
    ~^/api/admin/chat/                                             chat;

    ~^/api/(notification|notifications)/                           notification;
    ~^/api/admin/notifications/                                    notification;

    ~^/api/(city|issues|community)/                                city;
    ~^/api/admin/(issues|authorities|community)/                   city;

    ~^/api/loyalty/                                                loyalty;
    ~^/api/admin/loyalty/                                          loyalty;

    ~^/api/(b2b)/                                                  b2b;
    ~^/api/admin/b2b/                                              b2b;

    ~^/api/(analytics)/                                            analytics;
    ~^/api/admin/analytics/                                        analytics;
}

server {
    listen 80;
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service-to-service endpoints are never reachable from outside.
    location /api/internal/ { return 404; }

    location /api/chat/ws/ {
        set $chat_upstream chat;
        proxy_pass http://$chat_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        if ($service = "") { return 404; }
        proxy_pass http://$service:8000;
    }

    location /media/public/ {
        alias /data/media/public/;
        expires 7d;
    }

    location = /health { return 200 "ok\n"; }
}
