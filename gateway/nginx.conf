# Docker's DNS; resolving per request lets the gateway start before every service is up.
resolver 127.0.0.11 valid=10s ipv6=off;

include /etc/nginx/conf.d/routes.map;

server {
    listen 80;
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service-to-service endpoints are never reachable from outside.
    location /api/internal/ { return 404; }

    location /api/chat/ws/ {
        set $chat_upstream chat;
        proxy_pass http://$chat_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        if ($service = "") { return 404; }
        proxy_pass http://$service:8000;
    }

    location /media/public/ {
        alias /data/media/public/;
        expires 7d;
    }

    location = /health { return 200 "ok\n"; }
}
