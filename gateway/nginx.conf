upstream auth_service    { server auth:8000; }
upstream catalog_service { server catalog:8000; }

server {
    listen 80;
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/    { proxy_pass http://auth_service; }
    location /api/me/      { proxy_pass http://auth_service; }
    location /api/areas/   { proxy_pass http://auth_service; }

    location /api/catalog/    { proxy_pass http://catalog_service; }
    location /api/categories/ { proxy_pass http://catalog_service; }
    location /api/products/   { proxy_pass http://catalog_service; }
    location /api/services/   { proxy_pass http://catalog_service; }

    location = /health { return 200 "ok\n"; }
}
