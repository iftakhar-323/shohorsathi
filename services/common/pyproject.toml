[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shohor-common"
version = "0.1.0"
description = "Shared settings, JWT config and permissions for ShohorSathi Django services"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt[crypto]>=5.3,<5.4",
    "django-cors-headers>=4.4,<5",
    "drf-spectacular>=0.27,<0.28",
    "psycopg[binary]>=3.2,<3.3",
    "celery[redis]>=5.4,<5.5",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["shohor_common*"]
